name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      # 只有严格的版本号 tag 才触发构建与 PyPI 发布，
      # 避免测试/拼错 tag 误发正式包
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PyPI 只发源码包，不再预编译 wheel；各平台二进制由 release.yml 构建
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          npm install
          npm run build
          # biliup-cli 编译时内嵌 out/，sdist 必须带上；pyproject 的 include 相对 crates/stream-gears，即 sdist 根目录
          cp -r out crates/stream-gears/out
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/stream-gears/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      # 和用户 pip install biliup 一样从 sdist 现场编译
      - name: Smoke test sdist
        run: |
          python -m venv /tmp/smoke-venv
          # mypy is pinned because new stubtest releases add checks.
          /tmp/smoke-venv/bin/pip install dist/biliup-*.tar.gz pytest mypy==2.3.1
          /tmp/smoke-venv/bin/pytest crates/stream-gears/tests -v
      - name: Check type stubs against the installed package
        run: /tmp/smoke-venv/bin/python -m mypy.stubtest stream_gears
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
