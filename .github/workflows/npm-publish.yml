name: npm

on:
  release:
    types: [published]
  # 补发某个已有 Release（如本工作流加入之前的 v1.2.9），或勾选 dry_run 只打包验证
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，如 v1.2.9'
        required: true
      dry_run:
        description: '只打包、冒烟测试并 npm publish --dry-run，不发布（不需要 NPM_TOKEN）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # 预发布不发 npm，与 release.yml / ci.yml 只认严格版本号 tag 一致
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    # Release 建好时二进制还没构建完（release.yml 由 tag push 触发，v1.2.9 用了约 2 小时 20 分钟），prepare 最多等 300 分钟
    timeout-minutes: 330
    permissions:
      contents: read
      # trusted publishing（OIDC）与 npm publish --provenance
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Check NPM_TOKEN
        if: env.DRY_RUN != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN is not configured::仓库 Settings → Secrets and variables → Actions 里没有 NPM_TOKEN，未发布任何包。请维护者在 npmjs.com 生成可发布 @biliup/*（根包 @biliup/cli 与 7 个平台子包）的 token 并添加为仓库 secret，然后在 Actions 里手动运行本工作流（tag 填 ${TAG}）。"
            exit 1
          fi

      - uses: actions/checkout@v4

      # trusted publishing 需要 npm >= 11.5.1；Node 22 自带 npm 10，Node 24 自带 npm 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare packages from release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node npm/scripts/prepare.mjs --tag "$TAG" --wait 300

      - name: Smoke test (linux x64)
        run: npm/scripts/smoke-test.sh npm/dist linux-x64-gnu

      # 先发 7 个 @biliup/<平台> 子包，最后发根包 @biliup/cli；registry 上已有的版本跳过，失败后可直接重跑
      # npm 逐个包先用 OIDC 换发布 token，该包在 npmjs.com 没配 trusted publisher（或换取失败）时回落到 NODE_AUTH_TOKEN
      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm/scripts/publish.sh npm/dist --provenance

      - name: Publish (dry run)
        if: env.DRY_RUN == 'true'
        run: npm/scripts/publish.sh npm/dist --dry-run
