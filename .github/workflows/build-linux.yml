name: Build Biliup Linux Binary

on:
  push:
    branches: [ "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 👈 开启 NPM 缓存，加速 npm install

      # 👇 核心加速 1：缓存 Rust 的 Cargo 依赖和目标文件
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存 target 目录（这是最耗时的部分）
          cache-targets: true
          # 将缓存与当前系统绑定，避免冲突
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ffmpeg

      - name: Build Frontend
        run: |
          npm install
          npm run build

      - name: Build Backend (Release Mode)
        # 👇 核心加速 2：增加 --locked，确保依赖版本不会意外漂移，利用缓存
        run: cargo build --release --locked --bin biliup

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: biliup-linux-binary
          path: target/release/biliup
