name: GPU render acceptance

# Real hardware acceptance is deliberately opt-in. The normal Test workflow
# covers CPU output, vendor command plans and telemetry parser fixtures.
on:
  workflow_dispatch:
    inputs:
      encoder:
        description: H.264 encoder to require (no CPU fallback)
        type: choice
        required: true
        options:
          - h264_vaapi
          - h264_qsv
          - h264_nvenc
          - h264_amf
      device:
        description: DRM render node or GPU adapter index; empty uses driver default
        type: string
        default: ''
      runner:
        description: Self-hosted runner label with FFmpeg and GPU drivers
        type: string
        default: gpu

permissions:
  contents: read

concurrency:
  group: gpu-render-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  hardware-render:
    runs-on: [self-hosted, '${{ inputs.runner }}']
    timeout-minutes: 30
    env:
      BILIUP_TEST_ENCODER: ${{ inputs.encoder }}
      BILIUP_TEST_ENCODER_DEVICE: ${{ inputs.device }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build WebUI embedded by the backend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Require real GPU render, filtered output and MP4 concat
        run: cargo test --locked -p biliup-cli --lib hardware_render -- --nocapture
      - name: Require live NVIDIA GPU and encoder counters
        if: inputs.encoder == 'h264_nvenc'
        env:
          BILIUP_TEST_GPU_VENDOR: nvidia
        run: cargo test --locked -p biliup-cli --lib hardware_gpu_monitor -- --nocapture
