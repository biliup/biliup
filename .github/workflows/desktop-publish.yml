name: Desktop (Windows)

on:
  release:
    types: [created]
  # 手动触发只构建，安装包作为 artifact 上传，不碰 Release
  workflow_dispatch:

permissions:
  contents: read

env:
  # BtbN win64 GPL 静态构建 zip 的 SHA-256。tag 与版本号取自 Dockerfile（与 Docker 镜像同一构建），
  # 见 .github/scripts/ffmpeg-version.sh；Dockerfile 升级 FFmpeg 时同步更新这里。
  FFMPEG_WIN64_SHA256: 273abb45f3f9f76c303e35ff39f5bb6c23c163ae65f6244a32b7d4a7f6cf0616

jobs:
  build:
    permissions:
      contents: write
    runs-on: 'windows-latest'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    # biliup-cli 通过 rust-embed 把 out/ 编进桌面程序
    - name: Build frontend
      run: |
        npm install
        npm run build
    # 只取 ffmpeg.exe 和许可文本，由 tauri.ffmpeg.conf.json 作为资源打进安装包（安装目录下的 ffmpeg\）
    - name: Download FFmpeg
      shell: bash
      run: |
        eval "$(bash .github/scripts/ffmpeg-version.sh)"
        asset="ffmpeg-${FFMPEG_VERSION}-win64-gpl-${FFMPEG_BRANCH}"
        curl -fsSL --retry 3 -o ffmpeg.zip \
          "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${asset}.zip"
        echo "${FFMPEG_WIN64_SHA256}  ffmpeg.zip" | sha256sum -c -
        dest=tauri-app/src-tauri/ffmpeg
        mkdir -p "$dest"
        unzip -j -o ffmpeg.zip "${asset}/bin/ffmpeg.exe" "${asset}/LICENSE.txt" -d "$dest"
        cat > "$dest/README.txt" <<EOF
        FFmpeg ${FFMPEG_VERSION} (win64, GPL, static), built by BtbN/FFmpeg-Builds ${FFMPEG_TAG}.

        FFmpeg is licensed under the GNU General Public License version 3 or later
        (see LICENSE.txt in this folder). biliup runs it as a separate program.

        Corresponding source code:
          FFmpeg:        https://github.com/FFmpeg/FFmpeg/commit/${FFMPEG_COMMIT}
          Build scripts: https://github.com/BtbN/FFmpeg-Builds/tree/${FFMPEG_TAG}
        The biliup release this installer belongs to also carries these, together
        with the source of the libraries FFmpeg is built with, as ffmpeg-source-* assets:
          https://github.com/${GITHUB_REPOSITORY}/releases
        EOF
        ls -l "$dest"
        rm ffmpeg.zip
    - name: install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri-app/src-tauri -> target
    - name: install Tauri CLI
      working-directory: tauri-app
      run: npm ci
    - name: Build and upload to the release
      if: github.event_name == 'release'
      uses: tauri-apps/tauri-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # 用 releaseId 而不是 tagName：v1 找到已发布的 Release 时会用 releaseName/releaseBody 覆盖它的标题和正文
        releaseId: ${{ github.event.release.id }}
        projectPath: tauri-app
        args: --config src-tauri/tauri.ffmpeg.conf.json
    - name: Add download notes to the release
      if: github.event_name == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
        if ! grep -q 'biliup-desktop-notes' <<<"$body"; then
          printf '%s\n\n%s\n' "$body" "$(cat .github/desktop-release-notes.md)" > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
        fi
    - name: Build
      if: github.event_name != 'release'
      uses: tauri-apps/tauri-action@v1
      with:
        projectPath: tauri-app
        args: --config src-tauri/tauri.ffmpeg.conf.json
    - uses: actions/upload-artifact@v7
      if: github.event_name != 'release'
      with:
        name: biliup-desktop-windows
        path: |
          tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          tauri-app/src-tauri/target/release/bundle/msi/*.msi

  # GPL：Release 附上内置 FFmpeg 的对应源码（FFmpeg 源码、BtbN 构建脚本、构建脚本拉取的全部依赖源码）。
  # 手动触发时只打包并列出大小，不上传。
  ffmpeg-source:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Collect the FFmpeg corresponding source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        eval "$(bash .github/scripts/ffmpeg-version.sh)"
        mkdir dist
        full_commit=$(gh api "repos/FFmpeg/FFmpeg/commits/${FFMPEG_COMMIT}" --jq .sha)
        curl -fsSL --retry 3 -o "dist/ffmpeg-source-${FFMPEG_VERSION}.tar.gz" \
          "https://github.com/FFmpeg/FFmpeg/archive/${full_commit}.tar.gz"

        git clone -q --depth 1 --branch "$FFMPEG_TAG" https://github.com/BtbN/FFmpeg-Builds.git btbn
        git -C btbn archive --prefix="FFmpeg-Builds-${FFMPEG_TAG}/" \
          -o "../dist/ffmpeg-source-build-scripts-${FFMPEG_TAG}.tar.gz" HEAD
        # BtbN 自己的 download.sh 按 scripts.d 里固定的提交拉取每个依赖的源码，一个依赖一个 tar.xz。
        # 它按 GITHUB_REPOSITORY 拼容器镜像名，这里要指回 BtbN 的镜像，否则会去拉本仓库名下不存在的镜像。
        # 依赖分布在上百个上游服务器上，偶尔有连不上的；已下载的阶段有缓存，重试只补缺的。
        for attempt in 1 2 3; do
          (cd btbn && GITHUB_REPOSITORY=BtbN/FFmpeg-Builds ./download.sh > ../download.log 2>&1) && break
          tail -n 50 download.log
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 300
        done
        (cd btbn/.cache/downloads && find . -maxdepth 1 -type l -name '*.tar.xz' -printf '%P\n' | sort > ../../../deps.txt)
        tar -chf "dist/ffmpeg-source-dependencies-${FFMPEG_TAG}.tar" -C btbn/.cache/downloads -T deps.txt
        cd dist
        # GitHub Release 单个附件上限 2 GiB
        for f in *; do
          if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then split -b 1900M -d "$f" "$f.part"; rm "$f"; fi
        done
        cat > ffmpeg-source-README.txt <<EOF
        Corresponding source for the FFmpeg bundled with the Windows desktop installer
        (and used by the Docker image): FFmpeg ${FFMPEG_VERSION}, built by
        BtbN/FFmpeg-Builds ${FFMPEG_TAG} (win64 / linux64 / linuxarm64, GPL, static).

        ffmpeg-source-${FFMPEG_VERSION}.tar.gz
            FFmpeg at commit ${full_commit}
        ffmpeg-source-build-scripts-${FFMPEG_TAG}.tar.gz
            the build scripts and patches (https://github.com/BtbN/FFmpeg-Builds/tree/${FFMPEG_TAG})
        ffmpeg-source-dependencies-${FFMPEG_TAG}.tar
            the source of every library the scripts build, one tar.xz per build stage,
            as fetched by the scripts' download.sh at the commits pinned in scripts.d/.
            Files ending in .partNN are pieces of one tar: cat them together in order.
        EOF
        sha256sum * > ffmpeg-source-SHA256SUMS.txt
        ls -l
        echo "dependency stages: $(wc -l < ../deps.txt)"
    - name: Upload to the release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
