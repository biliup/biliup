name: Desktop (Windows)

on:
  release:
    types: [created]
  # 手动触发只构建，安装包作为 artifact 上传，不碰 Release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: 'windows-latest'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    # biliup-cli 通过 rust-embed 把 out/ 编进桌面程序
    - name: Build frontend
      run: |
        npm install
        npm run build
    - name: install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri-app/src-tauri -> target
    - name: install Tauri CLI
      working-directory: tauri-app
      run: npm ci
    - name: Build and upload to the release
      if: github.event_name == 'release'
      uses: tauri-apps/tauri-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # 用 releaseId 而不是 tagName：v1 找到已发布的 Release 时会用 releaseName/releaseBody 覆盖它的标题和正文
        releaseId: ${{ github.event.release.id }}
        projectPath: tauri-app
    - name: Build
      if: github.event_name != 'release'
      uses: tauri-apps/tauri-action@v1
      with:
        projectPath: tauri-app
    - uses: actions/upload-artifact@v7
      if: github.event_name != 'release'
      with:
        name: biliup-desktop-windows
        path: |
          tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          tauri-app/src-tauri/target/release/bundle/msi/*.msi
