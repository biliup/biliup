name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  npm-launcher:
    name: npm launcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test npm/tests/*.test.cjs
      - name: Frontend render and workbench logic tests
        run: |
          npm ci --no-audit --no-fund
          node --test app/lib/*.test.cjs

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # biliup-cli 通过 rust-embed 嵌入 out/ 前端产物，需要先构建
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 媒体测试必须使用真实 FFmpeg 和与预览共用的中文字体；弹幕 XML -> ASS 已静态链接进 biliup，
      # 不再安装外部转换器。BILIUP_REQUIRE_RENDER_TESTS 让缺少字体时测试失败而不是跳过。
      # de_DE 让“逗号小数点 locale 被拒绝”的测试真正运行。
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg locales cmake libreadline-dev
          sudo locale-gen de_DE.UTF-8
          sudo localedef -i fr_FR -f ISO-8859-1 fr_FR
          bash .github/scripts/build-render-tools.sh "$RUNNER_TEMP/render-tools"
          echo "BILIUP_RENDER_TOOLS_DIR=$RUNNER_TEMP/render-tools" >> "$GITHUB_ENV"
          echo "BILIUP_REQUIRE_RENDER_TESTS=1" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked --workspace
      - name: Build the pinned independent PCRE2 reference
        run: |
          source="$RUNNER_TEMP/pcre2-source"
          reference="$RUNNER_TEMP/pcre2-reference"
          commit=$(sed -n 's/^Commit: //p' crates/danmaku-factory-sys/vendor/pcre2/UPSTREAM)
          test -n "$commit"
          git clone --quiet https://github.com/PCRE2Project/pcre2.git "$source"
          git -C "$source" checkout --quiet "$commit"
          git -C "$source" submodule update --init --depth 1
          cmake -S "$source" -B "$reference" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON \
            -DPCRE2_BUILD_PCRE2_8=ON -DPCRE2_BUILD_PCRE2_16=ON -DPCRE2_BUILD_PCRE2_32=ON \
            -DPCRE2_SUPPORT_UNICODE=ON -DPCRE2_SUPPORT_JIT=ON
          cmake --build "$reference" --parallel 2
          ctest --test-dir "$reference" --output-on-failure
          echo "PCRE2_UPSTREAM_SOURCE=$source" >> "$GITHUB_ENV"
          echo "PCRE2_ORACLE_BUILD=$reference" >> "$GITHUB_ENV"
          echo "PCRE2_RUST_STATICLIB=$GITHUB_WORKSPACE/target/release/libpcre2_rust.a" >> "$GITHUB_ENV"
      - name: Full PCRE2 syntax, ABI, JIT, POSIX and serialization compatibility
        run: |
          cargo build --locked --release -p pcre2-rust --lib
          cargo test --locked -p pcre2-rust --test upstream_suite -- --ignored

  # 检查实际 Rust 核心和正则引擎；C 仅作为独立 ABI 测试客户端。
  danmaku-factory-sanitizers:
    name: Rust native cores under sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Run sanitizer checks
        # The production crates continue to build with stable Rust.
        run: CC=clang crates/danmaku-factory-sys/tests/c/check.sh

  pcre2-platforms:
    name: Rust conversion and PCRE2 API (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Conversion, complete 8/16/32-bit API and real JIT regression
        run: cargo test --locked -p danmaku-factory-sys -p danmaku-factory -p pcre2-rust

  # golden 语料必须能由固定提交的 DanmakuFactory CLI 重新生成：补丁版 CLI 写出期望结果，
  # 原版 CLI 除标记的上游缺陷用例外必须逐字节相同
  danmaku-factory-golden:
    name: DanmakuFactory golden corpus matches the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned CLI, with and without biliup's patches
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev pkg-config
          commit=$(sed -n 's/^Commit: //p' crates/danmaku-factory-sys/vendor/DanmakuFactory/UPSTREAM)
          test -n "$commit"
          git clone --quiet https://github.com/hihkm/DanmakuFactory.git "$RUNNER_TEMP/df"
          build() {
            mkdir -p "$RUNNER_TEMP/$1"
            mapfile -d '' sources < <(find "$RUNNER_TEMP/df/src" -type f -name '*.c' -print0)
            read -r -a pcre <<< "$(pkg-config --cflags --libs libpcre2-8)"
            cc -std=gnu11 -O2 "${sources[@]}" "${pcre[@]}" -lm -o "$RUNNER_TEMP/$1/DanmakuFactory"
          }
          git -C "$RUNNER_TEMP/df" checkout --quiet "$commit"
          build upstream
          git -C "$RUNNER_TEMP/df" apply "$GITHUB_WORKSPACE"/crates/danmaku-factory-sys/patches/*.patch
          build patched
      - name: Regenerate the corpus
        run: |
          python3 -I crates/danmaku-factory/tests/golden/generate.py \
            --cli "$RUNNER_TEMP/patched/DanmakuFactory" --upstream-cli "$RUNNER_TEMP/upstream/DanmakuFactory"
          git diff --exit-code -- crates/danmaku-factory/tests/golden

  # 桌面程序是独立 workspace，依赖变动时根 Cargo.lock 会更新，它的锁不会跟着变；
  # desktop-publish.yml 只在发版时跑，漂移要到那时才暴露（v1.2.9 就是这样）
  desktop-lockfile:
    name: Desktop Cargo.lock up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo metadata --locked
        run: cargo metadata --locked --format-version 1 --manifest-path tauri-app/src-tauri/Cargo.toml > /dev/null
