name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  # schedule:
  # - cron: '0 0 * * *' # midnight UTC

  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    ## - release
  # 从默认分支运行工作流，并显式指定要补发的旧 tag；不受提交说明中的跳过指令影响。
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的已有 tag，如 v1.3.0'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BIN_NAME: biliup
  PROJECT_NAME: biliupR
#  REPO_NAME: spectralops/rust-ci-release-template
#  BREW_TAP: jondot/homebrew-tap

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Validate tag and resolve commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag in the form v1.2.3"
            exit 1
          fi
          # 使用完整 tag 引用，兼容轻量/附注 tag，并为所有任务固定到同一个提交。
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  dist:
    name: Dist
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't fail other jobs if one fails
      matrix:
        build: [x86_64-linux, x86_64-linux-musl, aarch64-linux, arm-linux, x86_64-macos, x86_64-windows, aarch64-macos, aarch64-android] #, x86_64-win-gnu, win32-msvc
        include:
          - build: x86_64-linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-gnu
            cross: false
          - build: x86_64-linux-musl
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
            cross: true
          - build: aarch64-linux
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
            cross: true
          - build:  arm-linux
            os: ubuntu-latest
            rust: stable
            target: arm-unknown-linux-gnueabi
            cross: true
          - build: x86_64-macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
            cross: false
          - build: x86_64-windows
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc
            cross: false
          - build: aarch64-macos
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
            cross: false
          - build: aarch64-android
            os: ubuntu-latest
            rust: stable
            target: aarch64-linux-android
            cross: false
        # - build: x86_64-win-gnu
        #   os: windows-2019
        #   rust: stable-x86_64-gnu
        #   target: x86_64-pc-windows-gnu
        # - build: win32-msvc
        #   os: windows-2019
        #   rust: stable
        #   target: i686-pc-windows-msvc

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # actions-rs/cargo 已归档多年，改用 cross 官方安装方式
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install Android NDK
        if: matrix.build == 'aarch64-android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install cargo-ndk
        if: matrix.build == 'aarch64-android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # NDK 里没有系统 OpenSSL 开发库，pkg-config 找不到库会直接编译失败，
      # 这里改用 vendored（源码内置编译 OpenSSL）的方式规避
      - name: Patch Cargo.toml for Android (vendored OpenSSL)
        if: matrix.build == 'aarch64-android'
        run: |
          sed -i 's|reqwest = { version = "0.13.4", features = \["cookies", "form", "query"\] }|reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form", "query", "native-tls-vendored"] }|' Cargo.toml
          cargo update

      - name: Run cargo test
        if: matrix.build != 'aarch64-macos' && matrix.build != 'aarch64-android'
        shell: bash
        run: ${{ matrix.cross && 'cross' || 'cargo' }} test --release --locked --target ${{ matrix.target }} -p biliup

      - name: Build release binary
        if: matrix.build != 'aarch64-android'
        shell: bash
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }} --bin biliup

      - name: Build release binary (Android)
        if: matrix.build == 'aarch64-android'
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 24 build --release --locked --target ${{ matrix.target }} --bin biliup
        
      - name: Strip release binary (linux and macos)
        if: matrix.build == 'x86_64-linux' || matrix.build == 'x86_64-macos'
        run: strip "target/${{ matrix.target }}/release/$BIN_NAME"

      - name: Strip release binary (arm)
        if: matrix.build == 'aarch64-linux'
        run: |
          docker run --rm -v \
            "$PWD/target:/target:Z" \
            rustembedded/cross:${{ matrix.target }} \
            aarch64-linux-gnu-strip \
            /target/${{ matrix.target }}/release/$BIN_NAME
      - name: Build archive
        shell: bash
        run: |
          mkdir dist
          # 按运行器操作系统判断，matrix.os 的取值（windows-latest）永远不等于 windows-2019
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/$BIN_NAME.exe" "dist/"
          else
            cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.build }}
          path: dist

  publish:
    name: Publish
    needs: [prepare, dist]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      # 向 Release 上传产物需要写权限
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: false
      # 随包字体不进仓库：按固定 SHA-256 取回后再打进发布包
      - name: Fetch render fonts
        run: |
          dir=crates/biliup-cli/assets/render-tools/fonts
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/NotoSansSC-Regular.otf" 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf'
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $dir/NotoSansSC-Regular.otf" | sha256sum -c -
          curl -fsSL --retry 3 -o "$dir/NotoEmoji.ttf" 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf'
          echo "de6c18832938afc99caf132b39d6a30a19bac7f2e812e28db2535b4608d27551  $dir/NotoEmoji.ttf" | sha256sum -c -

      - uses: actions/download-artifact@v4
        # with:
        #   path: dist
      # - run: ls -al ./dist
      - run: ls -al bins-*

      - name: Build archive
        shell: bash
        run: |
          set -ex
          rm -rf tmp
          mkdir tmp
          mkdir dist
          for dir in bins-* ; do
              platform=${dir#"bins-"}
              # 每次迭代重置，否则 exe 会从 windows 平台泄漏到后续平台
              exe=""
              if [[ $platform =~ "windows" ]]; then
                  exe=".exe"
              fi
              pkgname=$PROJECT_NAME-$TAG-$platform
              mkdir tmp/$pkgname
              # cp LICENSE README.md tmp/$pkgname
              mv bins-$platform/$BIN_NAME$exe tmp/$pkgname
              # Rust 弹幕排版派生自 DanmakuFactory，随包保留 MIT 来源声明
              cp crates/danmaku-factory/THIRD-PARTY-NOTICES.txt tmp/$pkgname/
              # External font resources stay beside the executable, with their licenses.
              cp -R crates/biliup-cli/assets/render-tools tmp/$pkgname/render-tools
              chmod +x tmp/$pkgname/$BIN_NAME$exe
              if [ "$exe" = "" ]; then
                  tar cJf dist/$pkgname.tar.xz -C tmp $pkgname
              else
                  (cd tmp && 7z a -r ../dist/$pkgname.zip $pkgname)
              fi
          done
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ needs.prepare.outputs.tag }}
          overwrite: true
