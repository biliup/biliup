[package]
name = "danmaku-factory"
version.workspace = true
edition = "2024"
description = "Safe XML to ASS danmaku conversion with the statically linked DanmakuFactory core"
license = "MIT OR Apache-2.0"

[dependencies]
danmaku-factory-sys = { path = "../danmaku-factory-sys" }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.14"

[target.'cfg(unix)'.dev-dependencies]
# tests/errors.rs limits the file size of a child process to fail writes
libc = "0.2"
