[package]
name = "danmaku-factory-sys"
version.workspace = true
edition = "2024"
description = "DanmakuFactory's XML to ASS core and PCRE2, vendored and statically linked, behind a minimal C interface"
# biliup's own code (csrc/, build.rs, src/) is MIT OR Apache-2.0; the
# vendored DanmakuFactory core is MIT and PCRE2 is BSD-3-Clause.
license = "(MIT OR Apache-2.0) AND MIT AND BSD-3-Clause WITH PCRE2-exception"
links = "biliup_danmaku_factory"
build = "build.rs"

[build-dependencies]
# Compiles the vendored C sources; no system library, no bindgen/libclang.
cc = "1.2"
