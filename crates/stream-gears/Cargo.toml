[package]
name = "stream-gears"
version.workspace = true
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "stream_gears"
crate-type = ["cdylib", "lib"]

[features]
default = ["extension-module"]
# Skips linking libpython so plain `cargo build` / `cargo test` work without Python dev files;
# `--no-default-features` is only needed for Rust tests that embed an interpreter.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["abi3-py39", "anyhow"] }
pythonize = { version = "0.27.0" }
axum = { version = "0.8", features = ["macros"] }
nom = "8"
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
biliup = { path = "../biliup"}
biliup-cli = { path = "../biliup-cli"}
danmaku-client = { package = "danmaku", path = "../danmaku"}
time = { workspace = true }
bon = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.27.1"
